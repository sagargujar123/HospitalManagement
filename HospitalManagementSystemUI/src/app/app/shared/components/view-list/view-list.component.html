<div class="w-full overflow-x-auto">

    <div class="bg-white rounded-xl shadow-md p-6 border border-gray-200 mb-4">
        <!-- <h2 class="text-xl font-semibold text-indigo-600 mb-4">Doctor Information</h2> -->
        <div class="flex flex-col sm:flex-row items-center justify-between pb-4">
            <h2 class="text-xl font-semibold mb-4 sm:mb-0" [ngClass]="'text-indigo-600'">
                {{ 'Doctor Information' }}
            </h2>
            <button type="button" (click)="goBack()" class=" hover:text-white text-gray-800 px-6 py-2 rounded-lg shadow"
                [ngClass]="'bg-indigo-500'">
                <i class="fas fa-arrow-left mr-2"></i>
                Back
            </button>
        </div>

        <div
            class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-5 text-gray-700 text-center border border-gray-300 rounded-xl p-4">
            <div *ngFor="let col of doctorColumns" class="flex flex-col">
                <!-- Label -->
                <span class="text-sm font-medium text-gray-500">{{ col.label }}</span>
                <!-- Value -->
                <span class="text-base font-semibold break-words">
                    {{ doctor[col.key] }}
                </span>
            </div>
        </div>
    </div>


    <!-- Patient Table Card -->
    <div class="bg-white rounded-2xl shadow-md p-7 border border-gray-200 flex flex-col">

        <h2 class="text-xl font-semibold text-green-600 mb-4">Patient List</h2>

        <!-- Search -->
        <div class="mb-3">
            <input type="text" [(ngModel)]="searchTerm" placeholder="Search ..."
                class="w-1/3 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400" />
        </div>

        <!-- Table -->
        <div class="overflow-y-auto max-h-96">
            <table class="min-w-full border border-gray-300 rounded-lg text-center">
                <thead class="bg-gray-100 sticky top-0">
                    <tr>
                        <th class="px-4 py-2 text-sm font-medium border border-gray-300 text-gray-700">#</th>
                        <th *ngFor="let col of columns"
                            class="px-4 py-2 text-sm font-medium border border-gray-300 text-gray-700">
                            {{ col.label }}
                        </th>
                        <th class="px-4 py-2 text-sm font-medium border border-gray-300 text-gray-700">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let patient of filteredPatients; let i = index" class="hover:bg-gray-50">
                        <td class="px-4 py-2 border text-sm text-gray-600 border-gray-300">{{ i + 1 }}</td>
                        <td *ngFor="let col of columns" class="px-4 py-2 border text-sm text-gray-600 border-gray-300">
                            {{ patient[col.key] !== undefined ? patient[col.key] : '-' }}
                        </td>
                        <td class="px-4 py-2 border text-sm space-x-2 text-gray-600 border-gray-300">
                            <div class="flex justify-center space-x-1">
                                <i class="fas fa-eye text-blue-500 cursor-pointer hover:text-blue-700" title="View">
                                </i>
                                <i class="fas fa-edit text-green-500 cursor-pointer hover:text-green-700" title="Edit">
                                </i>
                                <i class="fas fa-trash text-red-500 cursor-pointer hover:text-red-700" title="Delete">
                                </i>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
