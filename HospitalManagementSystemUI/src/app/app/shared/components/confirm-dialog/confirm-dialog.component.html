<div class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 z-50" *ngIf="show">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 animate-fadeIn">

        <!-- Header -->
        <div class="flex justify-between items-center mb-3">
            <h2 class="text-xl font-semibold text-red-600">{{ title }}</h2>
            <button (click)="onCancel()"
                class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-400 hover:bg-red-600 text-white">
                ✕
            </button>
        </div>

        <!-- Content -->
        <p class="text-gray-600 mb-4">{{ message }}</p>

        <!-- Item Details -->
        <div *ngIf="item" class="bg-gray-50 p-5 rounded-lg border border-gray-200 mb-5">

            <div class="space-y-2">
                <!-- Loop each field -->
                <div *ngFor="let key of objectKeys(item)"
                    class="grid grid-cols-1 sm:grid-cols-4 sm:gap-6 border-gray-100">

                    <!-- Label -->
                    <span class="text-gray-500 col-span-2 font-medium sm:text-left">
                        {{ key }}
                    </span>

                    <!-- Value -->
                    <span class="text-gray-900 col-span-2 font-semibold sm:text-left" [innerHTML]="handleField(item[key])">
                        <!-- {{ handleField(item[key]) }} -->
                    </span>
                </div>
            </div>

        </div>


        <!-- Footer -->
        <div class="flex justify-end space-x-3 mt-4">
            <button class="px-5 py-2 rounded-lg bg-gray-200 text-gray-800 hover:bg-gray-300 transition"
                (click)="onCancel()">
                Cancel
            </button>
            <button class="px-5 py-2 rounded-lg bg-red-600 text-white hover:bg-red-700 transition"
                (click)="onConfirm(item.ID)">
                Delete
            </button>
        </div>
    </div>
</div>


<!-- common modal form -->
<div class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 z-50" *ngIf="showForm">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 animate-fadeIn">

        <!-- Header -->
        <div class="flex justify-between items-center mb-3">
            <h2 class="text-xl font-semibold text-green-600">{{ 'Update Status' }}</h2>
            <button (click)="onCancel()"
                class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-400 hover:bg-green-600 text-white">
                ✕
            </button>
        </div>

        <!-- Item Details -->
        <div *ngIf="item" class="bg-gray-50 p-5 rounded-lg border border-gray-200 mb-5">
            <div class="space-y-2">
                <!-- Loop each field -->
                <div *ngFor="let key of objectKeys(item)"
                    class="grid grid-cols-1 sm:grid-cols-4 sm:gap-6 border-gray-100">

                    <!-- Label -->
                    <span class="text-gray-500 col-span-2 font-medium sm:text-left">
                        {{ key }}
                    </span>

                    <!-- Value -->
                    <span class="text-gray-900 col-span-2 font-semibold sm:text-left">
                        {{ item[key] ? item[key] : '--' }}
                    </span>
                </div>
                <div class="p-3 bg-white border border-gray-300 rounded-lg mt-5">
                    <label for="status" class="block text-gray-700 font-medium mb-2">Update Status :</label>
                    <select #dropdown (change)="onDropdownChange(dropdown.value)"
                        class="px-3 py-2 border border-gray-300 rounded-md bg-white w-full sm:w-1/3 lg:w-[50%] focus:outline-none focus:ring-2 focus:ring-indigo-400 cursor-pointer">
                        <option *ngFor="let option of dropdownOptions" [value]="option">
                            {{ option }}
                        </option>
                    </select>
                    <p *ngIf="isSelected" class="text-sm text-red-500">Status selection is required</p>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="flex justify-end space-x-3 mt-4 pb-2">
            <button class="px-5 py-2 rounded-lg bg-gray-200 text-gray-800 hover:bg-gray-300 transition"
                (click)="onCancel()">
                Cancel
            </button>
            <button class="px-5 py-2 rounded-lg bg-green-600 text-white hover:bg-green-700 transition"
                (click)="onUpdate(item)">
                Update
            </button>
        </div>
    </div>
</div>
