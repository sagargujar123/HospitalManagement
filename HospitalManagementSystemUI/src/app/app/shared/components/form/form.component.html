<div class="w-full flex justify-center">
    <div class="w-full border border-gray-300 md:h-auto bg-white shadow-lg rounded-2xl p-7 overflow-y-auto">
        <div class="flex flex-col sm:flex-row items-center justify-between pb-4">
            <h2 class="text-2xl font-semibold mb-4 sm:mb-0" [ngClass]="config.textColor">
                {{ isEdit ? config.textEditHeader : config.textAddHeader }}
            </h2>
            <button type="button" (click)="goBack()" class=" hover:text-white text-gray-800 px-6 py-2 rounded-lg shadow"
                [ngClass]="config.backButtonColor">
                <i class="fas fa-arrow-left mr-2"></i>
                Back
            </button>
        </div>

        <hr class="border-t-2 mb-6" [ngClass]="config.hrColor">

        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="grid grid-cols-1 md:grid-cols-2 gap-4">

            <!-- Loop fields -->
            <div *ngFor="let field of formFields" class="flex flex-col">
                <label [for]="field.name" class="text-md font-medium mb-1 text-gray-700">{{ field.label }}</label>

                <!-- Text / Number / Date -->
                <div class="relative w-4/5">
                    <input *ngIf="field.type !== 'select'"
                        [type]="field.type === 'password' ? (showPassword ? 'text' : 'password') : field.type"
                        [formControlName]="field.name" [placeholder]="field.placeholder" [id]="field.name"
                        class="border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400 w-full pr-10" />

                    <!-- Toggle icon for password -->
                    <button *ngIf="field.type === 'password'" type="button" (click)="showPassword = !showPassword"
                        class="absolute right-2 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-gray-700 focus:outline-none">
                        <i class="fas" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
                    </button>
                </div>


                <!-- Select -->
                <select *ngIf="field.type === 'select'" [formControlName]="field.name" [ngClass]="{
                                'text-gray-400': !form.get(field.name)?.value, 
                                'text-gray-800': form.get(field.name)?.value}" [id]="field.name"
                    class="border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400 cursor-pointer w-4/5">
                    <option value="" hidden>{{field.placeholder}}</option>
                    <option *ngFor="let opt of field.options" [ngValue]="opt.id" class="text-gray-800">{{opt.name}}
                    </option>
                </select>

                <!-- Error -->
                <span class="text-red-500 text-sm mt-1" *ngFor="let validation of field.validations">
                    <ng-container *ngIf="form.get(field.name)?.hasError(validation.name) && 
                        (form.get(field.name)?.touched || form.get(field.name)?.dirty)">
                        {{ validation.message }}
                    </ng-container>
                </span>

            </div>

            <!-- Buttons -->
            <div class="col-span-full flex justify-end gap-3 mt-6">
                <button type="submit" class=" text-white px-6 py-2 rounded-lg shadow"
                    [ngClass]="config.submitButtonColor">
                    {{ isEdit ? 'Update' : 'Submit' }}
                </button>
                <button type="reset" class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-6 py-2 rounded-lg shadow">
                    Reset
                </button>
            </div>
        </form>
    </div>
</div>
