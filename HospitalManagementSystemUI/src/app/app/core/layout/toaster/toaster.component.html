<!-- Toaster Component -->
<div class="fixed top-12 left-1/2 -translate-x-1/2 z-50 flex items-start justify-end pointer-events-none">

    <div class="relative max-w-sm w-96 px-6 py-4 rounded-lg shadow-2xl text-white text-lg font-medium tracking-wide transition-all duration-500 ease-in-out pointer-events-auto"
        [ngClass]="{
      'bg-green-400': message?.type === 'success',
      'bg-red-400': message?.type === 'error',
      'opacity-100 translate-y-0': visible,
      'opacity-0 -translate-y-12': !visible
    }">
        <!-- Close Button -->
        <span class="absolute top-3 right-3 text-white text-xl font-bold">
            &times;
        </span>

        <!-- Message Text -->
        {{ message?.text }}
    </div>
</div>
