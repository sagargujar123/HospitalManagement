<div class="h-[900px] flex flex-col">

  <!-- Top Navbar -->
  <header class="bg-gray-900 text-white flex items-center justify-between px-6 py-3">
    <!-- Left: Logo + Title -->
    <div class="flex items-center gap-3">
      <img src="assets/hospital.jpg" alt="Logo" class="h-10 w-10 rounded-full">
      <div class="font-bold text-lg">Hospital Management</div>
    </div>

    <div class="relative group inline-block" (click)="toggleDropdown()">
      <!-- Trigger -->
      <div class="flex items-center gap-2 cursor-pointer select-none">
        <span class="font-medium">{{ userName }}</span>
        <img src="assets/profile.png" class="h-10 w-10 rounded-full border-2 border-white" />
      </div>

      <!-- Dropdown -->
      <div class="absolute right-0 top-full w-44 bg-white text-gray-800 rounded-lg shadow-lg z-50
           opacity-0 invisible group-hover:opacity-100 group-hover:visible
           transition duration-200" [class.opacity-100]="dropdownOpen" [class.visible]="dropdownOpen">
        <ul class="py-2 text-sm">
          <li><a routerLink="/update" class="block px-4 py-2 hover:bg-gray-100">Update</a></li>
          <li><button (click)="onLogout()" class="w-full text-left px-4 py-2 hover:bg-gray-100">Sign Out</button></li>
        </ul>
      </div>
    </div>
  </header>





  <div class="flex flex-col h-screen">

    <!-- Main wrapper -->
    <div class="flex flex-1 overflow-hidden relative">

      <!-- Sidebar -->
      <aside [class.translate-x-0]="sidebarOpen || !isMobile"
        [class.-translate-x-full]="sidebarOpen === false && isMobile" class="bg-gray-800 text-white flex flex-col transition-transform duration-300
             w-48 z-50 shadow-lg
             absolute md:relative h-full"> <!-- absolute for mobile -->

        <nav class="flex-1 p-4 space-y-2 text-md font-medium overflow-y-auto">

          <!-- Patients -->
          <a routerLink="/patients/list" routerLinkActive="bg-gray-700"
            class="flex items-center px-4 py-2 rounded hover:bg-gray-700 transition">
            <i class="fas fa-user-injured text-lg"></i>
            <span class="ml-3">Patients</span>
          </a>

          <!-- Doctors -->
          <a routerLink="/doctors" routerLinkActive="bg-gray-700"
            class="flex items-center px-4 py-2 rounded hover:bg-gray-700 transition">
            <i class="fas fa-user-md text-lg"></i>
            <span class="ml-3">Doctors</span>
          </a>

          <!-- Appointments -->
          <a routerLink="/appointments" routerLinkActive="bg-gray-700"
            class="flex items-center px-4 py-2 rounded hover:bg-gray-700 transition">
            <i class="fas fa-calendar-alt text-lg"></i>
            <span class="ml-3">Appointments</span>
          </a>

          <!-- Users -->
          <a routerLink="/users" routerLinkActive="bg-gray-700"
            class="flex items-center px-4 py-2 rounded hover:bg-gray-700 transition">
            <i class="fas fa-users text-lg"></i>
            <span class="ml-3">Users</span>
          </a>

          <!-- Reports -->
          <a routerLink="/reports" routerLinkActive="bg-gray-700"
            class="flex items-center px-4 py-2 rounded hover:bg-gray-700 transition">
            <i class="fas fa-file-alt text-lg"></i>
            <span class="ml-3">Reports</span>
          </a>

          <!-- Settings -->
          <a routerLink="/settings" routerLinkActive="bg-gray-700"
            class="flex items-center px-4 py-2 rounded hover:bg-gray-700 transition">
            <i class="fas fa-cogs text-lg"></i>
            <span class="ml-3">Settings</span>
          </a>

        </nav>
      </aside>

      <!-- Main Content -->
      <main [class.ml-0]="isMobile" class="flex-1 overflow-y-auto bg-gray-100 relative transition-all duration-300">
        <router-outlet></router-outlet>
      </main>

      <!-- Mobile Toggle Button -->
      <button
        class="sm:block md:hidden fixed bottom-20 right-4 z-50 bg-blue-600 hover:bg-blue-700 text-white p-4 rounded-full shadow-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        (click)="sidebarOpen = !sidebarOpen">
        <i class="fas fa-bars text-xl"></i>
      </button>

    </div>
  </div>


</div>
