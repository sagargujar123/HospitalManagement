<div class="min-h-full flex items-center justify-center bg-gradient-to-r from-blue-100 via-purple-100 to-pink-100 p-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Create Account</h2>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <!-- Username -->
      <div class="my-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Username <span class="text-pink-600">[Email Address]</span></label>
        <input type="text" formControlName="username" placeholder="Enter email address"
          class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none" />

        <div
          *ngIf="form.controls['username'].invalid && (form.controls['username'].dirty || form.controls['username'].touched)"
          class="text-red-500 text-sm mt-1">
          <p *ngIf="form.controls['username'].errors?.['required']">Email is required.</p>
          <p *ngIf="form.controls['username'].errors?.['pattern']">Enter a valid email address.</p>
        </div>
      </div>

      <!-- Password -->
      <div class="my-4">
        <div class="relative">
          <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input formControlName="password" [type]="showPassword ? 'text' : 'password'" placeholder="Enter password"
            class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none" />
          <i class="fas absolute right-3 top-9 cursor-pointer text-gray-500"
            [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'" (click)="togglePassword()"></i>
        </div>

        <!-- Error messages -->
        <div *ngIf="form.controls['password'].invalid && (form.controls['password'].dirty || form.controls['password'].touched)" class="text-red-500 text-sm mt-1">
          <p *ngIf="form.controls['password'].errors?.['required']">Password is required.</p>
          <p *ngIf="form.controls['password'].errors?.['pattern']">
            Password must be at least 8 chars, include 1 uppercase, 1 lowercase, 1 number & 1 special.
          </p>
        </div>
      </div>

      <!-- Role -->
      <div class="my-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Role</label>
        <select formControlName="role"
          class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none cursor-pointer">
          <option value="User" selected>User</option>
        </select>

        <!-- Error messages -->
        <!-- <div *ngIf="form.controls['role'].invalid && (form.controls['role'].dirty || form.controls['role'].touched)" class="text-red-500 text-sm mt-1">
          <p *ngIf="form.controls['role'].errors?.['required']">Role is required.</p>
        </div> -->
      </div>

      <!-- Button -->
      <button type="submit" 
        class="w-full mt-5 py-2 px-4 bg-gradient-to-r from-blue-500 to-purple-600 text-white rounded-lg shadow-md hover:opacity-90 transition cursor-pointer">
        Register
      </button>
    </form>

    <p class="text-center text-sm text-gray-600 mt-4">
      Already have an account?
      <a routerLink="/auth/login" class="text-blue-600 hover:underline">Login</a>
    </p>
  </div>
</div>
