<div class="min-h-full flex items-center justify-center bg-gradient-to-r from-green-100 via-teal-100 to-cyan-100 p-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Welcome Back</h2>

    <form class="space-y-5">
      <!-- Username -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input type="text" placeholder="Enter username"
          class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-teal-500 outline-none" />
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" placeholder="Enter password"
          class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-teal-500 outline-none" />
      </div>

      <!-- Button -->
      <button type="submit"
        class="w-full py-2 px-4 bg-gradient-to-r from-teal-500 to-cyan-600 text-white rounded-lg shadow-md hover:opacity-90 transition">
        Login
      </button>
    </form>

    <p class="text-center text-sm text-gray-600 mt-4">
      Don’t have an account?
      <a routerLink="/auth/register" class="text-teal-600 hover:underline">Register</a>
    </p>
  </div>
</div>
